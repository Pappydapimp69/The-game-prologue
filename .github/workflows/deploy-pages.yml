name: Deploy to GitHub Pages

# Explicit workflow rather than relying on the dynamic Pages builder — a
# dynamic build can queue with no jobs and no visible failure (see
# memory/projects/local__dbh.md#E6). This one is inspectable in Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke suite
        run: node scripts/smoke.mjs
      - name: Cache-bust every ES module import, not just the entry script
        # index.html only ever versioned its own <script src="src/main.js?v=...">
        # — every one of the nested relative imports (main.js importing
        # title.js, game.js, ...) is a SEPARATE browser cache entry keyed by
        # its own unversioned URL. Bumping the entry script does nothing for
        # those, so a returning visitor's browser can keep serving a stale
        # nested module indefinitely even after a fix ships and the entry
        # script is refetched (memory/projects/pappydapimp69__the-game-
        # prologue.md#E8 — this exact gap, deferred there, already fixed and
        # verified via this same step in the-game-the-waiting-city and
        # the-game-wrong-sky; ported here to close it in the origin project
        # too). Rewriting every import specifier with the same per-deploy
        # token here — on the ephemeral deploy artifact only, never the repo
        # source — closes the gap completely instead of leaving it partial.
        run: |
          VER="${{ github.sha }}"
          grep -rl --include='*.js' -E "from ['\"]\.[^'\"]+\.js['\"]" src/ \
            | xargs -r sed -i -E "s/(from ['\"][^'\"]+\.js)(['\"])/\1?v=${VER}\2/g"
          sed -i -E "s#(src=\"src/main\.js)(\?v=[^\"]*)?(\")#\1?v=${VER}\3#" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
